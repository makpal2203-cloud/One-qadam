<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONE QADAM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
<style>
:root { --bg:#09080F; --card:#1A1725; --card2:#262234; --p:#9747FF; --a:#C5A3FF; --muted:#8d86a3; --line:#3a3450; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:#fff; font-family:-apple-system,system-ui,sans-serif; }
.hidden { display:none !important; }
.center-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
.muted { color:var(--muted); }
.card { background:var(--card); border-radius:20px; padding:20px; margin-bottom:16px; }
.auth-card { width:100%; max-width:420px; padding:28px; margin:0; }
h1 { margin:0 0 4px; color:var(--a); font-size:28px; }
h2 { margin:0 0 12px; }
h3 { margin:20px 0 10px; color:var(--a); }
.tag { color:var(--muted); margin:0 0 20px; font-size:14px; }
.tabs { display:flex; gap:8px; margin-bottom:16px; }
.tab { flex:1; padding:10px; border:0; border-radius:12px; background:var(--card2); color:#fff; font-size:16px; cursor:pointer; }
.tab.active { background:var(--p); }
input, select, textarea { width:100%; padding:14px; margin-bottom:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:#fff; font-size:16px; font-family:inherit; }
textarea { min-height:140px; resize:vertical; }
input[type=checkbox] { width:auto; margin:0 8px 0 0; }
label.chk { display:flex; align-items:center; margin-bottom:12px; }
.btn { padding:14px; border:0; border-radius:12px; background:var(--p); color:#fff; font-size:16px; cursor:pointer; }
.btn.full { width:100%; }
.btn.alt { background:var(--card2); }
.btn.danger { background:#7a1f33; }
.btn.sm { padding:8px 12px; font-size:14px; }
.btn:disabled { opacity:.6; }
.msg { margin-top:12px; font-size:14px; min-height:20px; }
.err { color:#ff6b81; }
.ok { color:#6be39a; }
.top { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--card2); padding:12px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.brand { color:var(--a); font-weight:800; font-size:20px; }
nav { display:flex; gap:8px; flex-wrap:wrap; }
.nb { padding:8px 14px; border:0; border-radius:12px; background:var(--card2); color:#fff; font-size:15px; cursor:pointer; }
.nb.active { background:var(--p); }
main { max-width:760px; margin:0 auto; padding:16px; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.stat { background:var(--card); border-radius:16px; padding:14px; text-align:center; }
.num { font-size:24px; font-weight:700; color:var(--a); }
.lbl { font-size:13px; color:var(--muted); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
.subj { background:var(--card); border-radius:16px; padding:16px; cursor:pointer; border:1px solid transparent; }
.subj:hover { border-color:var(--p); }
.lesson { display:flex; justify-content:space-between; gap:8px; padding:12px; border-radius:12px; background:var(--card2); margin-top:8px; cursor:pointer; }
.chip { font-size:12px; color:#ffcf6b; }
.content { white-space:pre-wrap; line-height:1.6; margin:12px 0 20px; }
.row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--card2); gap:12px; }
.row span:first-child { color:var(--muted); }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--card2); padding:12px 18px; border-radius:12px; z-index:20; max-width:90%; }
.toast.ok { color:#6be39a; }
.toast.err { color:#ff6b81; }
</style>
</head>
<body>

<div id="loading" class="center-wrap"><div class="muted">Жүктелуде...</div></div>

<div id="auth" class="center-wrap hidden">
  <div class="card auth-card">
    <h1>ONE QADAM</h1>
    <p class="tag">Study. Play. Achieve.</p>
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="setMode('login')">Кіру</button>
      <button class="tab" id="tab-register" onclick="setMode('register')">Тіркелу</button>
    </div>
    <input id="name" class="hidden" type="text" placeholder="Аты-жөніңіз" autocomplete="name">
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Құпиясөз (кемінде 6 таңба)" autocomplete="current-password">
    <button class="btn full" id="submit" onclick="submitAuth()">Кіру</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="brand">ONE QADAM</div>
    <nav id="nav"></nav>
  </header>
  <main id="main"></main>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL = "https://zjzjtntuxwujjndifhcb.supabase.co";
const SUPABASE_KEY = "sb_publishable_amRUD3FA7_4aTogxndPaEA_1W0K6lxq";

const $ = (id) => document.getElementById(id);
let db = null;
let mode = "login";

const S = {
  user: null, profile: null, booted: false,
  view: "home", openSubject: null, openLesson: null,
  subjects: [], topics: [], lessons: [], done: new Set()
};

/* ---------- көмекші функциялар ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  const a = attrs || {};
  for (const k in a) {
    const v = a[k];
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = v;
    else el.setAttribute(k, v);
  }
  kids.flat().forEach((c) => {
    if (c === null || c === undefined || c === false) return;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  });
  return el;
}

function toast(text, type) {
  const t = $("toast");
  t.textContent = text;
  t.className = "toast " + (type || "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = "toast hidden"; }, 3500);
}

function showScreen(name) {
  ["loading", "auth", "app"].forEach((s) => $(s).classList.toggle("hidden", s !== name));
}

function say(text, type) {
  const el = $("msg");
  el.textContent = text;
  el.className = "msg " + (type || "");
}

const isAdmin = () => S.profile && S.profile.role === "admin";

/* ---------- кіру және тіркелу ---------- */
function setMode(m) {
  mode = m;
  $("tab-login").classList.toggle("active", m === "login");
  $("tab-register").classList.toggle("active", m === "register");
  $("name").classList.toggle("hidden", m === "login");
  $("submit").textContent = m === "login" ? "Кіру" : "Тіркелу";
  say("", "");
}

function friendlyError(message) {
  const m = (message || "").toLowerCase();
  if (m.includes("invalid login")) return "Email немесе құпиясөз қате.";
  if (m.includes("not confirmed")) return "Email расталмаған. Поштаңыздағы хатты тексеріңіз.";
  if (m.includes("already registered")) return "Бұл email тіркелген. «Кіру» бөлімін таңдаңыз.";
  if (m.includes("at least 6") || m.includes("weak")) return "Құпиясөз кемінде 6 таңба болуы керек.";
  if (m.includes("rate limit")) return "Тым көп әрекет. Біраз күте тұрыңыз.";
  if (m.includes("failed to fetch")) return "Интернетпен байланыс жоқ немесе кілт қате.";
  return "Қате: " + message;
}

async function submitAuth() {
  if (!db) return;
  const email = $("email").value.trim();
  const password = $("password").value;
  const fullName = $("name").value.trim();
  if (!email || !password) { say("Email мен құпиясөзді жазыңыз.", "err"); return; }
  if (mode === "register" && !fullName) { say("Аты-жөніңізді жазыңыз.", "err"); return; }

  $("submit").disabled = true;
  say("Күте тұрыңыз...", "");
  try {
    if (mode === "login") {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) say(friendlyError(error.message), "err");
    } else {
      const { data, error } = await db.auth.signUp({
        email, password, options: { data: { full_name: fullName } }
      });
      if (error) say(friendlyError(error.message), "err");
      else if (!data.session) say("Поштаңызға растау хаты жіберілді. Хаттағы сілтемені басыңыз, сосын «Кіру» бөліміне өтіңіз.", "ok");
    }
  } catch (e) {
    say(friendlyError(String(e && e.message ? e.message : e)), "err");
  }
  $("submit").disabled = false;
}

async function logout() { await db.auth.signOut(); }

/* ---------- деректерді жүктеу ---------- */
async function loadProfile(userId) {
  for (let i = 0; i < 3; i++) {
    const { data } = await db.from("profiles")
      .select("full_name, role, xp").eq("id", userId).maybeSingle();
    if (data) return data;
    await new Promise((r) => setTimeout(r, 700));
  }
  return null;
}

async function loadData() {
  const [s, t, l, p] = await Promise.all([
    db.from("subjects").select("id,name,sort_order").order("sort_order"),
    db.from("topics").select("id,subject_id,name,sort_order,created_at").order("sort_order").order("created_at"),
    db.from("lessons").select("id,topic_id,title,content,is_published,created_at").order("created_at"),
    db.from("lesson_progress").select("lesson_id").eq("user_id", S.user.id)
  ]);
  const bad = [s, t, l, p].find((r) => r.error);
  if (bad) toast("Деректерді жүктеу қатесі: " + bad.error.message, "err");
  S.subjects = s.data || [];
  S.topics = t.data || [];
  S.lessons = l.data || [];
  S.done = new Set((p.data || []).map((x) => x.lesson_id));
}

async function boot(user) {
  S.user = user;
  const profile = await loadProfile(user.id);
  if (!profile) {
    showScreen("auth");
    say("Профиль табылмады. Қайта кіріп көріңіз.", "err");
    return;
  }
  S.profile = profile;
  await loadData();
  S.booted = true;
  showScreen("app");
  render();
}

/* ---------- мәзір және беттер ---------- */
function renderNav() {
  const items = [["home", "Басты бет"], ["subjects", "Пәндер"], ["profile", "Профиль"]];
  if (isAdmin()) items.push(["admin", "Әкімші"]);
  $("nav").replaceChildren(...items.map(([k, label]) =>
    h("button", {
      class: "nb" + (S.view === k ? " active" : ""),
      onclick: () => { S.view = k; S.openLesson = null; if (k !== "subjects") S.openSubject = null; render(); }
    }, label)));
}

function render() {
  renderNav();
  const m = $("main");
  m.replaceChildren();
  let v;
  if (S.view === "subjects") v = viewSubjects();
  else if (S.view === "profile") v = viewProfile();
  else if (S.view === "admin" && isAdmin()) v = viewAdmin();
  else v = viewHome();
  m.append(v);
  window.scrollTo(0, 0);
}

function stat(label, value) {
  return h("div", { class: "stat" }, h("div", { class: "num" }, value), h("div", { class: "lbl" }, label));
}

function publishedCount(subjectId) {
  const topicIds = S.topics.filter((t) => t.subject_id === subjectId).map((t) => t.id);
  return S.lessons.filter((l) => l.is_published && topicIds.includes(l.topic_id)).length;
}

function subjectCards() {
  return h("div", { class: "grid" }, S.subjects.map((s) =>
    h("div", {
      class: "subj",
      onclick: () => { S.view = "subjects"; S.openSubject = s.id; S.openLesson = null; render(); }
    }, h("b", {}, s.name), h("div", { class: "lbl" }, publishedCount(s.id) + " сабақ"))));
}

function viewHome() {
  const pub = S.lessons.filter((l) => l.is_published);
  const done = pub.filter((l) => S.done.has(l.id)).length;
  return h("div", {},
    h("h2", {}, "Сәлем, " + (S.profile.full_name || "оқушы") + "!"),
    h("div", { class: "stats" },
      stat("XP", S.profile.xp),
      stat("Өтілген сабақ", done + " / " + pub.length),
      stat("Пән", S.subjects.length)),
    h("h3", {}, "Пәндер"),
    subjectCards());
}

function lessonRow(l) {
  return h("div", { class: "lesson", onclick: () => { S.openLesson = l.id; render(); } },
    h("span", {}, (S.done.has(l.id) ? "✓ " : "") + l.title),
    !l.is_published && h("span", { class: "chip" }, "жарияланбаған"));
}

async function markDone(lessonId) {
  const { error } = await db.from("lesson_progress").insert({ lesson_id: lessonId });
  if (error && error.code !== "23505") { toast("Қате: " + error.message, "err"); return; }
  S.done.add(lessonId);
  toast("Сабақ өтілді деп белгіленді.", "ok");
  render();
}

function viewSubjects() {
  if (S.openLesson) {
    const l = S.lessons.find((x) => x.id === S.openLesson);
    if (!l) { S.openLesson = null; return viewSubjects(); }
    const done = S.done.has(l.id);
    return h("div", {},
      h("button", { class: "btn alt sm", onclick: () => { S.openLesson = null; render(); } }, "← Артқа"),
      h("h2", { style: "margin-top:16px" }, l.title),
      h("div", { class: "content" }, l.content || "Сабақ мәтіні әзірше жоқ."),
      h("button", {
        class: "btn", disabled: done ? "disabled" : null,
        onclick: () => markDone(l.id)
      }, done ? "Өтілді ✓" : "Өттім"));
  }
  if (S.openSubject) {
    const s = S.subjects.find((x) => x.id === S.openSubject);
    if (!s) { S.openSubject = null; return viewSubjects(); }
    const topics = S.topics.filter((t) => t.subject_id === s.id);
    return h("div", {},
      h("button", { class: "btn alt sm", onclick: () => { S.openSubject = null; render(); } }, "← Пәндер"),
      h("h2", { style: "margin-top:16px" }, s.name),
      topics.length === 0 && h("p", { class: "muted" }, "Бұл пәнде әзірше тақырып жоқ."),
      topics.map((t) => {
        const ls = S.lessons.filter((l) => l.topic_id === t.id);
        return h("div", { class: "card" },
          h("b", {}, t.name),
          ls.length === 0 && h("p", { class: "muted" }, "Сабақтар әзірше жоқ."),
          ls.map(lessonRow));
      }));
  }
  return h("div", {}, h("h2", {}, "Пәндер"), subjectCards());
}

/* ---------- профиль ---------- */
function viewProfile() {
  const nameInput = h("input", { type: "text", value: S.profile.full_name || "", placeholder: "Аты-жөніңіз" });
  return h("div", {},
    h("h2", {}, "Профиль"),
    h("div", { class: "card" },
      h("div", { class: "row" }, h("span", {}, "Рөл"), h("span", {}, isAdmin() ? "Әкімші" : "Оқушы")),
      h("div", { class: "row" }, h("span", {}, "XP"), h("span", {}, S.profile.xp)),
      h("div", { class: "row" }, h("span", {}, "Email"), h("span", {}, S.user.email))),
    h("div", { class: "card" },
      h("label", { class: "muted" }, "Атыңызды өзгерту"),
      nameInput,
      h("button", {
        class: "btn",
        onclick: async () => {
          const name = nameInput.value.trim();
          if (!name) { toast("Атын жазыңыз.", "err"); return; }
          const { error } = await db.from("profiles").update({ full_name: name }).eq("id", S.user.id);
          if (error) { toast("Қате: " + error.message, "err"); return; }
          S.profile.full_name = name;
          toast("Сақталды.", "ok");
          render();
        }
      }, "Сақтау")),
    h("button", { class: "btn alt full", onclick: logout }, "Шығу"));
}

/* ---------- әкімші панелі ---------- */
function viewAdmin() {
  const subOpts = () => S.subjects.map((s) => h("option", { value: s.id }, s.name));

  // 1. Тақырып қосу
  const tSub = h("select", {}, subOpts());
  const tName = h("input", { type: "text", placeholder: "Тақырып атауы (мысалы: Жасуша)" });
  const tBtn = h("button", {
    class: "btn",
    onclick: async () => {
      const name = tName.value.trim();
      if (!name) { toast("Тақырып атауын жазыңыз.", "err"); return; }
      const { error } = await db.from("topics").insert({ subject_id: tSub.value, name });
      if (error) { toast("Қате: " + error.message, "err"); return; }
      toast("Тақырып қосылды.", "ok");
      await loadData();
      render();
    }
  }, "Тақырып қосу");

  // 2. Сабақ қосу
  const lSub = h("select", {}, subOpts());
  const lTopic = h("select", {});
  const fillTopics = () => {
    lTopic.replaceChildren(...S.topics.filter((t) => t.subject_id === lSub.value)
      .map((t) => h("option", { value: t.id }, t.name)));
  };
  lSub.addEventListener("change", fillTopics);
  fillTopics();
  const lTitle = h("input", { type: "text", placeholder: "Сабақ атауы" });
  const lText = h("textarea", { placeholder: "Сабақ мәтіні" });
  const lPub = h("input", { type: "checkbox" });
  const lBtn = h("button", {
    class: "btn",
    onclick: async () => {
      if (!lTopic.value) { toast("Алдымен осы пәнге тақырып қосыңыз.", "err"); return; }
      if (!lTitle.value.trim()) { toast("Сабақ атауын жазыңыз.", "err"); return; }
      const { error } = await db.from("lessons").insert({
        topic_id: lTopic.value, title: lTitle.value.trim(),
        content: lText.value, is_published: lPub.checked
      });
      if (error) { toast("Қате: " + error.message, "err"); return; }
      toast("Сабақ қосылды.", "ok");
      await loadData();
      render();
    }
  }, "Сабақ қосу");

  // 3. Сабақтар тізімі
  const topicName = (id) => {
    const t = S.topics.find((x) => x.id === id);
    if (!t) return "";
    const s = S.subjects.find((x) => x.id === t.subject_id);
    return (s ? s.name + " → " : "") + t.name;
  };
  const list = S.lessons.length === 0
    ? h("p", { class: "muted" }, "Сабақ әзірше жоқ.")
    : S.lessons.map((l) => h("div", { class: "card" },
        h("b", {}, l.title),
        h("div", { class: "lbl" }, topicName(l.topic_id)),
        h("div", { class: l.is_published ? "ok" : "chip" }, l.is_published ? "Жарияланған" : "Жарияланбаған"),
        h("div", { class: "actions" },
          h("button", {
            class: "btn alt sm",
            onclick: async () => {
              const { error } = await db.from("lessons").update({ is_published: !l.is_published }).eq("id", l.id);
              if (error) { toast("Қате: " + error.message, "err"); return; }
              await loadData(); render();
            }
          }, l.is_published ? "Жасыру" : "Жариялау"),
          h("button", {
            class: "btn danger sm",
            onclick: async () => {
              if (!confirm("Бұл сабақты өшіресіз бе?")) return;
              const { error } = await db.from("lessons").delete().eq("id", l.id);
              if (error) { toast("Қате: " + error.message, "err"); return; }
              await loadData(); render();
            }
          }, "Өшіру"))));

  return h("div", {},
    h("h2", {}, "Әкімші панелі"),
    h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "1. Тақырып қосу"), tSub, tName, tBtn),
    h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "2. Сабақ қосу"),
      lSub, lTopic, lTitle, lText,
      h("label", { class: "chk" }, lPub, "Бірден жариялау (оқушыларға көрінеді)"),
      lBtn),
    h("h3", {}, "3. Барлық сабақтар"),
    list);
}

/* ---------- іске қосу ---------- */
function init() {
  if (typeof supabase === "undefined") {
    showScreen("auth");
    say("Supabase кітапханасы жүктелмеді. Интернетті тексеріп, бетті жаңартыңыз.", "err");
    return;
  }
  db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  db.auth.onAuthStateChange((event, session) => {
    setTimeout(() => {
      if (session && session.user) {
        if (S.booted && S.user && S.user.id === session.user.id) return;
        boot(session.user);
      } else {
        S.user = null; S.profile = null; S.booted = false;
        S.view = "home"; S.openSubject = null; S.openLesson = null;
        $("password").value = "";
        showScreen("auth");
      }
    }, 0);
  });

  setTimeout(() => {
    if (!$("loading").classList.contains("hidden")) showScreen("auth");
  }, 5000);
}

init();
</script>
</body>
</html>
