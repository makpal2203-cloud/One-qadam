async function submitAuth(){if(!db)return;

else{const{data,error}=await db.auth.signUp({email,password,options:{data:{full_name:fullName}}});

async function loadProfile(id){for(let i=0;i<3;i++){const{data}=await db.from("profiles").select("full_name, role, xp").eq("id",id).maybeSingle();if(data)return data;await new Promise(r=>setTimeout(r,700));}return null;}

else if(S.view==="admin"&&isAdmin())v=viewAdmin();

function prog(sid){const ids=S.topics.filter(t=>t.subject_id===sid).map(t=>t.id);
const ls=S.lessons.filter(l=>l.is_published&&ids.includes(l.topic_id));const d=ls.filter(l=>S.done.has(l.id)).length;
return{n:ls.length,p:ls.length?Math.round(d*100/ls.length):0};}

return h("div",{class:"sc",style:"background:"+c[0]},h("div",{class:"ic"},c[1]),h("b",{},s.name),

h("div",{class:"grid"},S.subjects.map(subjCard)),h("h3",{},"🏆 Лидерборд"),lbBox(3));}

ls.length===0?h("p",{class:"muted"},"Бұл пәнде сабақтар әзірше жоқ."):
h("div",{class:"grid"},ls.map(l=>{const d=S.done.has(l.id);
return h("div",{class:"card"},h("span",{class:"tg",style:"background:"+col},tn(l.topic_id)),
!l.is_published&&h("span",{class:"chip2"}," жарияланбаған"),
h("h3",{style:"color:#fff;margin:10px 0"},l.title),h("div",{class:"bar"},h("i",{style:"width:"+(d?100:0)+"%"})),
h("button",{class:"btn full sm",style:"margin-top:12px",onclick:()=>{S.openLesson=l.id;render();}},d?"Қайталау":"Бастау"));})));}

function viewStars(){const xp=S.profile.xp;

h("div",{class:"card"},h("h2",{},"Менің жұлдыздарым — "+xp+" ✨"),h("div",{class:"muted"},"Тест тапсырып жұлдыз жинаңыз, жаңа ғаламшарлар ашылады.")),

function viewAdmin(){
const so=()=>S.subjects.map(s=>h("option",{value:s.id},s.name));

const lTitle=h("input",{type:"text",placeholder:"Сабақ атауы"}),lText=h("textarea",{placeholder:"Сабақ мәтіні"}),lPub=h("input",{type:"checkbox"});
const lBtn=h("button",{class:"btn",onclick:async()=>{

h("b",{},l.title),h("div",{class:"muted"},tpn(l.topic_id)),
h("div",{class:l.is_published?"ok":"chip2"},l.is_published?"Жарияланған":"Жарияланбаған"),

function init(){
if(typeof supabase==="undefined"){showScreen("auth");say("Supabase кітапханасы жүктелмеді. Бетті жаңартыңыз.","err");return;}
db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
db.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>{
if(session&&session.user){if(S.booted&&S.user&&S.user.id===session.user.id)return;boot(session.user);}
else{S.user=null;S.profile=null;S.booted=false;S.view="home";S.openSubject=null;S.openLesson=null;$("password").value="";showScreen("auth");}},0);});
setTimeout(()=>{if(!$("loading").classList.contains("hidden"))showScreen("auth");},5000);}
init();
</script></body></html>
